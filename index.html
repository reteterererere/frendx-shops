<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win Tim Store</title>
    <!-- Подключаем скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --accent-color: #ffaa00;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .nick-input {
            background: var(--card-bg);
            border: 2px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: white;
            width: 100%;
            max-width: 300px;
            margin-bottom: 25px;
            outline: none;
            text-align: center;
        }

        .nick-input:focus {
            border-color: var(--accent-color);
        }

        .shop-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .product-card {
            background: var(--card-bg);
            border-left: 4px solid var(--accent-color);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .info h3 { margin: 0; font-size: 18px; }
        .info p { margin: 5px 0 0; color: var(--text-dim); font-size: 13px; }

        .buy-btn {
            background: var(--accent-color);
            border: none;
            border-radius: 5px;
            color: black;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .barter-btn {
            background: #55ff55;
            color: black;
        }

        /* Музыкальный плеер (скрытый) */
        #bg-music { display: none; }
    </style>
</head>
<body>

    <!-- Фоновая музыка -->
    <audio id="bg-music" autoplay loop>
        <source src="musick.mp3" type="audio/mpeg">
    </audio>

    <div class="header">
        <h1>Win Tim Store</h1>
        <p style="color: var(--text-dim);">Лучшие товары для вашего гриферства</p>
    </div>

    <input type="text" id="nick" class="nick-input" placeholder="Введите ваш никнейм..." required>

    <div class="shop-container">
        <!-- Товар 1 -->
        <div class="product-card">
            <div class="info">
                <h3>Custom CFG</h3>
                <p>Идеальные настройки для PVP</p>
            </div>
            <button class="buy-btn" onclick="sendToBot('Custom CFG', 100, 'UAH')">100 грн</button>
        </div>

        <!-- Товар 2 -->
        <div class="product-card" style="border-left-color: #00aaff;">
            <div class="info">
                <h3>Enough Visuals</h3>
                <p>Лучшие частицы и анимации</p>
            </div>
            <button class="buy-btn" style="background: #00aaff;" onclick="sendToBot('Enough Visuals', 150, 'UAH')">150 грн</button>
        </div>

        <!-- Оплата валютой FunTime / ReallyWorld -->
        <div class="product-card" style="border-left-color: #55ff55;">
            <div class="info">
                <h3>Оплата Ресурсами</h3>
                <p>Валюта FunTime / RW</p>
            </div>
            <button class="buy-btn barter-btn" onclick="sendToBot('Barter', 0, 'GAME')">ВЫБРАТЬ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно

        // Попытка включить музыку (некоторые браузеры блокируют автоплей без клика)
        document.body.addEventListener('click', () => {
            const audio = document.getElementById('bg-music');
            if (audio.paused) audio.play();
        }, { once: true });

        function sendToBot(itemName, price, currency) {
            const nickname = document.getElementById('nick').value;

            if (!nickname || nickname.length < 3) {
                tg.showAlert("⚠️ Пожалуйста, введите корректный никнейм!");
                return;
            }

            // Формируем данные для отправки в бот
            const orderData = {
                item: itemName,
                amount: price,
                curr: currency,
                player: nickname
            };

            // Отправляем данные и закрываем WebApp
            tg.sendData(JSON.stringify(orderData));
        }
    </script>
</body>
</html>
